[project]
name = "audio-evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yixian Tan", email = "yixian@aisingapore.org" }
]
requires-python = ">=3.11"
dependencies = [
    "fast-langdetect==0.3.2",
    "huggingface-hub>=2.1.1",
    "jieba>=0.42.1",
    "jiwer>=4.0.0",
    "loguru>=0.7.3",
    "pyarrow>=25.0.1",
    "pythainlp>=5.4.0",
    "python-dotenv>=1.2.4",
    "whisper-normalizer>=0.1.15",
    "zhconv>=1.4.3",
]

[project.scripts]
audio-evaluation = "audio_evaluation:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
